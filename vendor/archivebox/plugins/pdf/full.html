<!-- Use a document frame so the native PDF viewer works without allowing
     object/embed execution in the trusted preview's Content-Security-Policy. -->
<iframe src="{{ output_path }}#toolbar=1&navpanes=1&view=FitH"
       title="Archived PDF"
       class="extractor-fullscreen pdf-fullscreen"
       style="width: 100%; height: 100vh; border: 0; display: block;"></iframe>
