<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibility</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.url{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ax,.ax ul{list-style:none;margin:0;padding:0}.ax ul{margin-left:15px;padding-left:16px;border-left:1px solid #dbe3eb}.ax details>summary{cursor:pointer;display:flex;align-items:center;gap:7px;min-height:34px}.ax details>summary::marker{color:#94a3b8}.role{color:#365f8d;background:#edf5ff;border-color:#cadaed}.node-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}.properties{display:flex;gap:5px;flex-wrap:wrap;padding:0 0 8px 29px}.property{font-size:11px;color:#59697a}.outline{display:grid;gap:5px}.outline-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:9px;align-items:baseline;padding:6px 8px;border-radius:6px;background:#f8fafc}.outline-row span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frames{display:grid;gap:7px}.frame{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#f8fafc;min-width:0}.frame span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:560px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.outline-row{grid-template-columns:34px minmax(0,1fr)}}
.property{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.outline-row{grid-template-columns:72px minmax(0,1fr)}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>{{ plugin_icon }} Accessibility</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main id="content"></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};const content=document.getElementById('content');
  const icons={RootWebArea:'🌐',WebArea:'▣',heading:'H',link:'🔗',button:'▰',textbox:'⌨',image:'▧',navigation:'🧭',main:'◆',article:'▤',list:'☷',listitem:'•',table:'▦',row:'—',cell:'□',checkbox:'☑',radio:'◉',dialog:'▣',form:'▱'};
  function countNodes(node){if(!node||typeof node!=='object')return 0;return 1+(Array.isArray(node.children)?node.children.reduce((sum,child)=>sum+countNodes(child),0):0)}
  function nodeTree(node,depth=0){const li=el('li'),details=el('details');details.open=depth<2;const heading=el('summary'),role=String(node?.role||'node');heading.append(el('span',icons[role]||icons[role.toLowerCase()]||'◇'),el('span',role,'badge role'),el('span',node?.name||node?.value||'(unnamed)','node-name'));details.append(heading);const props=el('div',null,'properties');const ignored=new Set(['role','name','children','loaderId']);for(const [key,value] of Object.entries(node||{})){if(ignored.has(key)||value===undefined||value===null||value===''||value===false)continue;const shown=typeof value==='object'?JSON.stringify(value):String(value);const property=el('span',value===true?`✓ ${key}`:`${key}: ${shown}`,'badge property');property.title=`${key}: ${shown}`;props.append(property)}if(props.childElementCount)details.append(props);if(Array.isArray(node?.children)&&node.children.length){const list=el('ul');node.children.forEach(child=>list.append(nodeTree(child,depth+1)));details.append(list)}li.append(details);return li}
  function outlineParts(line){const text=String(line||'');const heading=text.match(/^(#{1,6})\s+(.*)$/);if(heading)return [`H${heading[1].length}`,heading[2],heading[1].length-1];const structural=text.match(/^(>+)(\S*)\s*(.*)$/);if(structural){const path=structural[2].split('>').filter(Boolean);return [path.at(-1)||'section',structural[3].replace(/^:\s*/,''),structural[1].length]}return ['•',text,0]}
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
    const headings=Array.isArray(data.headings)?data.headings:[],frames=Array.isArray(data.iframes)?data.iframes:[],nodes=countNodes(data.tree);
    const overview=el('section',null,'panel');overview.append(el('h2','Page semantics'),el('div',data.url||'','url'));const badges=el('div',null,'badges');badges.append(el('span',`◇ ${nodes} AX nodes`,'badge'),el('span',`H ${headings.length} outline entries`,'badge'),el('span',`▣ ${frames.length} frames`,'badge'));overview.append(badges);content.append(overview);
    const treePanel=el('section',null,'panel');treePanel.append(el('h2','Accessibility tree'));if(data.tree){const tree=el('ul',null,'ax');tree.append(nodeTree(data.tree));treePanel.append(tree)}content.append(treePanel);
    if(headings.length){const panel=el('section',null,'panel');panel.append(el('h2','Document outline'));const list=el('div',null,'outline');headings.forEach(line=>{const [kind,label,depth]=outlineParts(line),row=el('div',null,'outline-row');row.style.marginLeft=`${Math.min(depth,6)*12}px`;row.append(el('span',kind,'badge'),el('span',label));list.append(row)});panel.append(list);content.append(panel)}
    if(frames.length){const panel=el('section',null,'panel');panel.append(el('h2','Frame tree'));const list=el('div',null,'frames');frames.forEach(frame=>{const raw=String(frame||''),depth=(raw.match(/^>+/)||[''])[0].length,url=raw.slice(depth),row=el('div',null,'frame');row.style.marginLeft=`${Math.min(depth,8)*16}px`;row.append(el('span',depth?'↳':'▣'),el('span',url||'about:blank'));list.append(row)});panel.append(list);content.append(panel)}
  });
})();
</script></body></html>
