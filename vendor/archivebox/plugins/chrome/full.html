<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrome</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1080px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.muted{color:var(--muted)}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 3fr;gap:8px 16px;margin:0}dt{color:var(--muted);overflow-wrap:anywhere}dd{margin:0;overflow-wrap:anywhere}.browser{overflow:hidden;padding:0;border-color:#b7c1cc;box-shadow:0 12px 30px #1e293b17}.chrome-top{background:#dfe3e8;border-bottom:1px solid #c5cbd2}.tabs{height:42px;display:flex;align-items:flex-end;padding:0 14px;gap:12px}.lights{display:flex;gap:6px;padding-bottom:14px}.light{width:11px;height:11px;border-radius:50%}.tab{height:34px;min-width:230px;max-width:440px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff;border-radius:9px 9px 0 0}.tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;align-items:center;gap:9px;padding:8px 14px;background:#fff}.omnibox{min-width:0;flex:1;border-radius:18px;background:#f1f3f4;padding:6px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.viewport{padding:28px;background:linear-gradient(135deg,#f8fbff,#fff);min-height:250px}.diagram{display:flex;align-items:stretch;justify-content:center;gap:10px}.node{flex:1;min-width:0;max-width:250px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px}.node-icon{font-size:25px}.node strong{display:block;margin:5px 0}.node code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edge{display:grid;place-items:center;color:#8aa0b5}.status-good{color:#16803b}.extensions{display:grid;gap:8px}.extension{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px}.extension strong,.extension code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:640px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.browser{padding:0}.tab{min-width:140px}.diagram{flex-direction:column}.edge{transform:rotate(90deg)}dl{grid-template-columns:1fr}dd{margin-bottom:6px}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}

.hook-history{margin:0}.working-directory{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:18px;color:var(--muted)}.timeline{list-style:none;margin:0 0 0 6px;padding:0;border-left:2px solid var(--line)}.timeline-entry{position:relative;padding:0 0 22px 20px}.timeline-entry:last-child{padding-bottom:0}.timeline-entry:before{content:'';position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid white}.step-heading,.step-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.step-heading time{margin-left:auto;font:11px ui-monospace,monospace;color:var(--muted)}.step-result{white-space:pre-wrap;font-size:14px;font-weight:500;margin:5px 0;overflow-wrap:anywhere}.step-meta{font:11px/1.6 ui-monospace,monospace;color:var(--muted)}.step-meta a{color:inherit}.step-status{font:11px/1.6 system-ui,sans-serif}.step-status.good{color:#16803b}.step-status.bad{color:#b42318}.timeline-entry.archiving:before{background:#94a3b8}.timeline-entry.archiving .step-result{color:var(--muted);font-weight:400}.browser .viewport{padding:18px}.diagram{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1.3fr);align-items:start}.node{max-width:none;width:100%}.node code{white-space:normal;overflow-wrap:anywhere}.node dl{display:block;margin-top:14px}.node dt{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-top:10px}.node dd{font:12px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.navigation-flow{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.navigation-flow .route{padding:10px;background:#f1f5f9;border-radius:6px;overflow-wrap:anywhere}.navigation-flow .route-label{font-size:10px;text-transform:uppercase;color:var(--muted)}.navigation-flow .route-edge{padding:8px 12px;color:var(--accent)}.session-heading{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.session-heading strong{margin:0}.session-heading .node-icon{font-size:20px}.browser-caption{padding:8px 14px;background:#edf0f3;border-bottom:1px solid var(--line);font:11px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.capture-time{font-size:11px;color:var(--muted);margin-top:12px}.omnibox{white-space:normal;overflow-wrap:anywhere}.tab{min-width:0;flex:1}.tabs{min-width:0}.edge{align-self:center}@media(max-width:640px){.diagram{grid-template-columns:minmax(0,1fr)}.browser .viewport{padding:12px}.edge{transform:none;justify-self:center}.edge::first-letter{font-size:0}.edge{font-size:0}.edge:after{content:'↓';font-size:18px}.node{padding:12px}.toolbar{padding:8px}.extension{grid-template-columns:auto minmax(0,1fr)}.extension>.badge{grid-column:2;white-space:normal;overflow-wrap:anywhere}}
.node dd.hash-value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-details{grid-template-columns:90px minmax(0,1fr);gap:3px 12px;font:12px/1.6 ui-monospace,monospace;margin:8px 0}.step-details dd{overflow-wrap:anywhere}.step-url{margin:6px 0 10px}.installation{color:var(--muted)}.timeline-entry.installation:before{background:#cbd5e1}.installation .step-result{white-space:pre-wrap;font-size:12px;font-weight:400}.step-stdout{font-size:11px;color:var(--muted);margin-top:6px}.step-stdout summary{cursor:pointer}.step-stdout pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<header><h1>{{ plugin_icon }} Chrome</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main id="content"></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};const content=document.getElementById('content');
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  // Older extension caches omit the name segment required by Chrome Web Store.
  const webstoreURL=extension=>{
    const slug=String(extension.name||'extension').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'extension';
    return extension.webstore_url?.replace(/^(https:\/\/chromewebstore\.google\.com\/detail\/)([a-p]{32})(?=[/?#]|$)/,(_,base,id)=>`${base}${slug}/${id}`);
  };
  const get=async(name,json=false)=>{try{const url=new URL(name,folder);url.searchParams.set('raw','1');const r=await fetch(url);if(!r.ok)return null;return json?await r.json():await r.text()}catch{return null}};
  const short=value=>{const s=String(value||'').trim();return s.length>24?`${s.slice(0,12)}…${s.slice(-8)}`:s};
  Promise.all([get('navigation.json',true),get('browser.json',true),get('target_id.txt'),get('cdp_url.txt'),get('chrome.pid'),get('url.txt'),get('../index.jsonl')]).then(([nav,browser,target,endpoint,pid,savedURL,index])=>{
    target=target?.trim();endpoint=endpoint?.trim();pid=pid?.trim();const records=(index||'').split('\n').flatMap(line=>{try{return [JSON.parse(line)]}catch{return []}});
    const binaries=records.filter(record=>record.type==='Binary'&&/chrom(e|ium)/i.test(record.name||''));
    const results=records.filter(record=>record.type==='ArchiveResult'&&record.plugin==='chrome');
    const processes=records.filter(record=>record.type==='Process'&&(record.plugin==='chrome'||(record.cmd||[]).some(part=>/[/]chrome[/]on_/.test(part))));
    if(!target)for(const result of results){const match=(result.output_str||'').match(/(?:^|\s)target=([^\s]+)/);if(match)target=match[1]}
    const requested=nav?.url||savedURL?.trim()||'',finalURL=nav?.finalUrl||requested;let host='Chrome tab';try{host=new URL(finalURL).hostname||host}catch{}
    const status=nav?.status;
    const shell=el('section',null,'panel browser'),top=el('div',null,'chrome-top'),tabs=el('div',null,'tabs'),lights=el('div',null,'lights');[['#ff5f57'],['#febc2e'],['#28c840']].forEach(([color])=>{const dot=el('span',null,'light');dot.style.background=color;lights.append(dot)});const tab=el('div',null,'tab');tab.append(el('span','🌐'),el('span',host,'tab-title'),el('span','×','muted'));tabs.append(lights,tab);top.append(tabs);
    const toolbar=el('div',null,'toolbar');toolbar.append(el('span','‹','muted'),el('span','›','muted'),el('span','↻','muted'));const omni=el('div',null,'omnibox');omni.append(el('span',finalURL?.startsWith('https:')?'🔒 ':'◯ '),el('span',finalURL||requested||'about:blank'));toolbar.append(omni,el('span','⋮','muted'));top.append(toolbar);shell.append(top);
    const viewport=el('div',null,'viewport');shell.append(viewport);content.append(shell);
    const fields=(node,rows)=>{const dl=el('dl',null,'step-details');for(const [label,value] of rows){if(value!==null&&value!==undefined&&value!==''){const dd=el('dd',typeof value==='object'?JSON.stringify(value):value);dl.append(el('dt',label),dd)}}if(dl.childElementCount)node.append(dl)};
    if(results.length||binaries.length||nav){
      // Hook stdout and the final database export describe the same lifecycle.
      // Prefer persisted results (with process_id) for working admin links.
      const hooks=new Map();
      for(const result of results){const key=result.hook_name||result.id,previous=hooks.get(key);if(!previous||result.process_id||!previous.process_id)hooks.set(key,result)}
      const events=[];
      for(const result of hooks.values()){
        const matches=processes.filter(p=>p.hook_name===result.hook_name||(p.cmd||[]).some(arg=>typeof arg==='string'&&arg.endsWith('/'+result.hook_name+'.js')));
        const process=processes.find(p=>p.id===result.process_id)||matches[0];
        // Database exports can omit stdout; retain the original hook process log.
        const stdout=process?.stdout||matches.find(p=>p.stdout)?.stdout||'';
        const raw=typeof result.output_str==='string'&&result.output_str?result.output_str:stdout;
        const hook=result.hook_name||'',launch=hook.includes('chrome_launch'),tab=hook.includes('chrome_tab'),navigate=hook.includes('chrome_navigate');
        const shared=launch&&result.status==='skipped';
        events.push({title:launch?'Browser Launch':tab?'Tab Open':navigate?'Tab Navigate':hook.replace(/^on_\w+__\d+_/,'').replaceAll('_',' '),time:process?.started_at||result.start_ts,result,process,stdout,output:shared?'Using shared browser'+(raw?' ('+raw+')':''):raw});
        if(navigate&&nav)events.push({title:'Tab Load',time:nav.timestamp||result.end_ts||process?.ended_at,result,process,stdout,output:[status!=null?'HTTP '+status:null,nav.elapsed!=null?nav.elapsed+' ms':null,nav.waitUntil].filter(Boolean).join(' · ')||raw});
        if(tab&&process?.ended_at)events.push({title:'Tab Close',time:process.ended_at,result,process,stdout,output:process.exit_code===0?'Tab session finished':'Tab session ended with an error',close:true});
      }
      events.sort((a,b)=>(Date.parse(a.time)||0)-(Date.parse(b.time)||0));
      const lifecycle=el('section',null,'hook-history');lifecycle.append(el('h2','Capture timeline'));
      const pwd=events.find(event=>event.process?.pwd||event.result.pwd);if(pwd){const path=pwd.process?.pwd||pwd.result.pwd;const directory=el('div','Working directory · '+path,'working-directory mono');directory.title=path;lifecycle.append(directory)}
      const timeline=el('ol',null,'timeline');
      if(binaries.length){const install=el('li',null,'timeline-entry installation');install.append(el('strong','Browser Install'),el('div','Existing browser installation · may predate this capture','step-result'));const seen=new Set();for(const binary of binaries){const key=[binary.abspath,binary.version,binary.sha256].join('|');if(seen.has(key))continue;seen.add(key);fields(install,[['Binary',binary.name],['Version',binary.version],['Provider',binary.binprovider],['Executable',binary.abspath],['SHA-256',binary.sha256]])}timeline.append(install)}
      const adminBase=new URL('{{ snapshot.admin_change_url|escapejs }}'||'/admin/',location.href);
      const adminLink=(kind,id)=>{const link=el('a',kind+' '+'…'+String(id).slice(-8));link.href=new URL('/admin/'+(kind==='result'?'core/archiveresult/':'machine/process/')+encodeURIComponent(id)+'/change/',adminBase).href;link.target='_blank';link.rel='noopener';link.title=kind+' '+id;return link};
      let dated=false;
      for(const event of events){
        const {result,process}=event,item=el('li',null,'timeline-entry'),heading=el('div',null,'step-heading');heading.append(el('strong',event.title));
        if(event.time){const date=new Date(event.time);if(!Number.isNaN(date.valueOf())){const iso=date.toISOString(),time=el('time',dated?iso.slice(11,23):iso.slice(0,10)+' '+iso.slice(11,23)+' UTC');time.dateTime=iso;time.title=iso;heading.append(time);dated=true}}
        item.append(heading,el('div',event.output||result.status||'No result recorded','step-result'));
        if(event.title==='Browser Launch')fields(item,[['CDP endpoint',endpoint],['Browser PID',pid],...Object.entries(browser||{}).filter(([key])=>!['extensions','ready'].includes(key))]);
        if(event.title==='Tab Open')fields(item,[['Target ID',target]]);
        if(event.title==='Tab Navigate'&&requested){const url=el('div',null,'step-url');url.append(el('span','Requested · ','muted'),safeLink(requested));item.append(url)}
        if(event.title==='Tab Load'&&finalURL){const url=el('div',null,'step-url');url.append(el('span','Final · ','muted'),safeLink(finalURL));item.append(url);fields(item,Object.entries(nav||{}).filter(([key])=>!['url','finalUrl','status','elapsed','waitUntil','timestamp'].includes(key)))}
        const meta=el('div',null,'step-meta'),code=process?.exit_code,status=event.close?(code===0?'succeeded':'failed'):result.status;
        const marker=status==='skipped'?'↪':status==='failed'||(code!=null&&code!==0)?'✕':status==='succeeded'?'✓':'◷';
        const badge=el('span',marker+' '+(status||'pending')+(code!=null?' · exit '+code:''),'step-status '+(marker==='✓'?'good':marker==='✕'?'bad':''));meta.append(badge);
        if(result.process_id&&result.id)meta.append(adminLink('result',result.id));
        if(process?.id&&process.machine_id)meta.append(adminLink('process',process.id));
        if(process?.pid!=null)meta.append(el('span','PID '+process.pid));
        item.append(meta);
        // Keep the unparsed source available even when structured metadata renders.
        if(event.stdout&&event.stdout!==event.output){const details=el('details',null,'step-stdout');details.append(el('summary','Raw stdout'),el('pre',event.stdout));item.append(details)}
        timeline.append(item);
        if(event.title==='Tab Load'&&!events.some(e=>e.title==='Tab Load'&&e!==event&&Date.parse(e.time)>Date.parse(event.time))){const archiving=el('li',null,'timeline-entry archiving');const heading=el('div',null,'step-heading');heading.append(el('strong','Archiving'));const start=process?.ended_at||result.end_ts;if(start&&!Number.isNaN(Date.parse(start))){const iso=new Date(start).toISOString(),time=el('time',iso.slice(11,23));time.dateTime=iso;time.title=iso;heading.append(time)}const outputs=new Map();for(const output of records.filter(r=>r.type==='ArchiveResult'&&r.plugin!=='chrome'))outputs.set(output.hook_name||output.id,output);const completed=[...outputs.values()].filter(r=>r.status==='succeeded').length;archiving.append(heading,el('div',completed?completed+' page outputs captured by other plugins':'Page capture phase','step-result'));timeline.append(archiving)}
      }
      lifecycle.append(timeline);viewport.append(lifecycle);
    }
    const extensions=Array.isArray(browser?.extensions)?browser.extensions:[];if(extensions.length){const panel=el('section',null,'panel');panel.append(el('h2',`Extensions · ${extensions.length}`));const list=el('div',null,'extensions');extensions.forEach((extension,index)=>{const row=el('div',null,'extension');row.append(el('span','🧩'),el('span',null));const body=row.children[1],name=extension.name||extension.id||`Extension ${index+1}`;body.append(extension.webstore_url?safeLink(webstoreURL(extension),name):el('strong',name));const extensionPath=extension.unpacked_path||extension.crx_path||extension.path;if(extensionPath)body.append(el('code',extensionPath));const metadata=[extension.version&&`v${extension.version}`,extension.manifest_version&&`MV${extension.manifest_version}`,short(extension.id)].filter(Boolean).join(' · ');row.append(el('span',metadata,'badge'));list.append(row)});panel.append(list);content.append(panel)}
  });
})();
</script></body></html>
