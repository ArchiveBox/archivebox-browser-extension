<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8;--blue:#3b6f9e;--green:#16805b;--red:#b84040}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:16px;margin:0}h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1180px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.mono,code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.muted{color:var(--muted)}.host-head{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}.host-head .badge{margin-left:auto}.map{display:grid;grid-template-columns:minmax(180px,1.15fr) 32px minmax(160px,.8fr) 32px minmax(180px,1fr);gap:8px;align-items:stretch}.column{display:flex;flex-direction:column;gap:8px}.node{min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfcfd}.node.request{border-left:4px solid var(--blue)}.node.answer{border-left:4px solid var(--green)}.node.error{border-left-color:var(--red);background:#fff8f8}.node.resolver{border-style:dashed}.node strong,.node a{display:block;overflow-wrap:anywhere}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.meta span{font-size:11px;color:var(--muted)}.arrow{display:grid;place-items:center;color:#94a3b8;font-size:20px}.resolver-note{font-size:11px;color:var(--muted);margin-top:7px}.copyline{display:flex;align-items:center;gap:6px}.copyline code{min-width:0;flex:1}.copy{padding:2px 5px;font-size:10px}@media(max-width:720px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.map{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:24px}.host-head .badge{margin-left:0}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>{{ plugin_icon }} DNS Records</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main id="content"></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  const parseJsonl=text=>text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).flatMap(line=>{try{return[JSON.parse(line)]}catch{return[]}});const content=document.getElementById('content');
  const copyLine=value=>{const row=el('div',null,'copyline'),code=el('code',value),button=el('button','Copy','copy');button.type='button';button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(String(value));button.textContent='Copied'}catch{button.remove()}});row.append(code,button);return row};
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(text=>{
    const records=parseJsonl(text),groups=new Map();records.forEach(record=>{const key=record.hostname||'Unknown host';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(record)});
    const answerCount=records.filter(r=>r.ip).length;
    groups.forEach((items,hostname)=>{
      const panel=el('section',null,'panel'),head=el('div',null,'host-head');head.append(el('span','◉'),el('h2',hostname),el('span',items.length+' record'+(items.length===1?'':'s'),'badge'));panel.append(head);
      const map=el('div',null,'map'),requests=el('div',null,'column'),answers=el('div',null,'column'),resolvers=el('div',null,'column');requests.append(el('h3','REQUESTS'));answers.append(el('h3','ANSWERS'));resolvers.append(el('h3','CONFIGURED RESOLVERS'));
      const requestKeys=new Set();items.forEach(item=>{const key=String(item.requestId||'')+'|'+String(item.url||'');if(requestKeys.has(key)||(!item.url&&!item.requestId))return;requestKeys.add(key);const node=el('div',null,'node request');node.append(safeLink(item.url,item.url||'Browser request'));const meta=el('div',null,'meta');if(item.requestId)meta.append(el('span','id '+item.requestId));if(item.protocol)meta.append(el('span',item.protocol.toUpperCase()));node.append(meta);requests.append(node)});if(requests.children.length===1){const node=el('div',null,'node request');node.append(el('strong','Observed hostname'),el('span','No request URL recorded','muted'));requests.append(node)}
      items.forEach(item=>{const node=el('div',null,'node answer'+(item.type==='NXDOMAIN'?' error':''));const line=el('div');line.append(el('span',(item.type==='NXDOMAIN'?'✕ ':'● ')+(item.type||'DNS'),'badge'));node.append(line,item.ip?copyLine(item.ip):el('strong','Name not resolved'));const meta=el('div',null,'meta');if(item.port)meta.append(el('span','port '+item.port));if(item.source)meta.append(el('span','via '+item.source));if(item.ts){const date=new Date(item.ts);meta.append(el('span',Number.isNaN(date.valueOf())?item.ts:date.toLocaleString()))}node.append(meta);if(item.error)node.append(el('div',item.error,'resolver-note'));answers.append(node)});
      const nameservers=[...new Set(items.flatMap(item=>Array.isArray(item.nameservers)?item.nameservers:[]))];nameservers.forEach(ns=>{const node=el('div',null,'node resolver');node.append(copyLine(ns));resolvers.append(node)});if(!nameservers.length){const node=el('div',null,'node resolver');node.append(el('span','Not recorded','muted'));resolvers.append(node)}resolvers.append(el('div','Resolver configuration was captured with each answer; it does not identify which resolver replied.','resolver-note'));
      map.append(requests,el('div','→','arrow'),answers,el('div','⇢','arrow'),resolvers);panel.append(map);content.append(panel);
    });
  }).catch(()=>content.append(el('div','Unable to read DNS data.','panel muted')));
})();
</script></body></html>
