<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image gallery</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:white;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}#count{color:var(--muted);font-size:12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}main{padding:16px}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.tile{min-width:0;margin:0;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.tile>a{display:block;aspect-ratio:1;background:#eceff3}.tile img{display:block;width:100%;height:100%;object-fit:contain}.tile figcaption{padding:7px 9px;font-size:11px;color:var(--muted)}.filename{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}.source{display:flex;justify-content:space-between;gap:6px;margin-top:3px}dialog{width:min(1100px,96vw);max-width:96vw;max-height:96vh;padding:0;border:1px solid var(--line);border-radius:9px;background:#fff}dialog::backdrop{background:#101827cc}.viewer-bar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}#viewer-name{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}#viewer-image{display:block;max-width:100%;max-height:80vh;margin:auto;object-fit:contain}dialog a{color:var(--ink)}.empty{color:var(--muted);padding:24px;text-align:center}@media(max-width:1100px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}nav .label{display:none}header{padding:8px}nav a{min-width:40px;min-height:40px}main{padding:10px}.gallery{gap:8px}}@media(max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:15px}header{gap:6px}#count{font-size:11px}nav{gap:3px}}
</style></head><body>
<header><h1>{{ plugin_icon }} Gallery</h1><span id="count"></span><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main><div id="gallery" class="gallery"></div></main>
<dialog id="viewer" aria-label="Image preview"><div class="viewer-bar"><span id="viewer-name"></span><a id="viewer-download" download>⤓ Download</a><button id="close" aria-label="Close image">×</button></div><img id="viewer-image" alt=""></dialog>
<script>
(()=>{
 const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
 const root=new URL(output);const boundary=root.pathname.lastIndexOf('/gallerydl/');root.pathname=boundary>=0?root.pathname.slice(0,boundary+1):new URL('../',output).pathname;
 const files=[{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'gallerydl' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',plugin:'{{ capture.plugin|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }},mime:'{{ info.mimetype|escapejs }}',size:'{{ info.size|escapejs }}'},{% endfor %}{% endif %}{% endfor %}];
 const raw=url=>{const u=new URL(url);u.searchParams.set('raw','1');return u.href};
 document.getElementById('files').href=new URL('gallerydl/?files=1',root).href;document.getElementById('download').href=raw(output);document.getElementById('raw').href=output.href+'?preview=1&raw=1';
 const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
 const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),seen=new Set();
 const add=(url,name,source,size)=>{if(seen.has(url))return;seen.add(url);const tile=el('figure',null,'tile'),link=el('a'),img=el('img');link.href=url;link.title=name;img.src=raw(url);img.alt=name;img.loading='lazy';img.decoding='async';link.append(img);const caption=el('figcaption'),filename=el('span',name,'filename'),meta=el('span',null,'source');filename.title=name;meta.append(el('span',source));const bytes=Number(size);if(bytes>0)meta.append(el('span',bytes>=1048576?(bytes/1048576).toFixed(1)+' MB':Math.ceil(bytes/1024)+' KB'));caption.append(filename,meta);tile.append(link,caption);gallery.append(tile);link.addEventListener('click',event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();const image=document.getElementById('viewer-image');image.src=raw(url);image.alt=name;document.getElementById('viewer-name').textContent=name;document.getElementById('viewer-download').href=raw(url);viewer.showModal()})};
 for(const file of files){const path=file.path.replace(/^\.\//,'');if(path.startsWith('/')||path.split('/').includes('..'))continue;const relative=file.root?path:file.plugin+'/'+path;if(file.plugin==='gallerydl'&&!file.mime.startsWith('image/')&&!/\.(avif|bmp|gif|ico|jpe?g|png|svg|tiff?|webp)$/i.test(path))continue;add(new URL(relative.split('/').map(encodeURIComponent).join('/'),root).href,path.split('/').pop(),'GalleryDL',file.size)}
 if(!seen.size&&/\.(avif|bmp|gif|ico|jpe?g|png|svg|tiff?|webp)$/i.test(output.pathname))add(output.href,decodeURIComponent(output.pathname.split('/').pop()),'GalleryDL','');
 document.getElementById('count').textContent=seen.size+' images';if(!seen.size)gallery.replaceWith(el('p','No captured images','empty'));
 document.getElementById('close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});
})();
</script></body></html>
