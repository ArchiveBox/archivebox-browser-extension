<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP Headers</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8;--request:#3b6f9e;--response:#16805b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0}nav{display:flex;gap:6px;margin-left:auto}nav a{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none}nav a:hover{background:#edf2f7}a{color:var(--accent);overflow-wrap:anywhere}main{max-width:1180px;margin:0 auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}.exchange{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:start}.message{overflow:hidden}.message.request{border-top:4px solid var(--request)}.message.response{border-top:4px solid var(--response)}.message-head{display:flex;align-items:center;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.message-head .status{margin-left:auto}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#f1f5f9;padding:2px 7px;font-size:12px;color:#475569}.status.good{background:#ecf8f2;border-color:#bce2d1;color:#146b4c}.status.redirect{background:#fff8e8;border-color:#efd9a4;color:#945d09}.status.bad{background:#fff0f0;border-color:#efc8c8;color:#a43e3e}.url{display:block;margin:12px 0;font-weight:600;overflow-wrap:anywhere}.headers{margin-top:10px}.header-row{display:grid;grid-template-columns:minmax(110px,.7fr) minmax(0,1.5fr);gap:12px;padding:7px 0;border-bottom:1px solid #edf0f3}.header-row:last-child{border:0}.header-name{color:#8a3d73;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.header-name.pseudo{color:#9a6414}.header-value{color:#244b69;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.flow{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;color:#94a3b8}.flow span:first-child{font-size:26px}.flow span:last-child{font-size:10px;text-transform:uppercase;letter-spacing:.08em;writing-mode:vertical-rl}.final{margin-bottom:16px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;gap:8px;align-items:center;overflow-wrap:anywhere}.muted{color:var(--muted)}@media(max-width:760px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.panel{padding:14px}.exchange{grid-template-columns:1fr}.flow{min-height:42px;flex-direction:row;gap:6px}.flow span:first-child{transform:rotate(90deg)}.flow span:last-child{writing-mode:initial}.header-row{grid-template-columns:1fr;gap:2px}}
@media(max-width:600px){nav a{min-width:40px;min-height:40px}header{flex-wrap:wrap}nav{flex-shrink:0}main{min-width:0}}
</style></head><body>
<header><h1>{{ plugin_icon }} HTTP Headers</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main id="content"></main>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=output.href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
  const safeLink=(value,label)=>{const a=el('a',label||value);try{const u=new URL(value);if(['https:','http:'].includes(u.protocol)){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer'}}catch{}return a};
  const displayValue=value=>typeof value==='string'?value:JSON.stringify(value);const content=document.getElementById('content');
  const message=(kind,title,url,headers,status)=>{const box=el('section',null,'panel message '+kind),head=el('div',null,'message-head');head.append(el('span',kind==='request'?'↗':'↙'),el('h2',title));if(status!=null){const n=Number(status),cls=n>=200&&n<300?'good':n>=300&&n<400?'redirect':n>=400?'bad':'';head.append(el('span',String(status),'badge status '+cls))}box.append(head);if(url)box.append(safeLink(url,url));if(box.lastElementChild&&box.lastElementChild.tagName==='A')box.lastElementChild.className='url';const list=el('div',null,'headers');Object.entries(headers||{}).sort(([a],[b])=>a.localeCompare(b)).forEach(([name,value])=>{const row=el('div',null,'header-row');row.append(el('div',name,'header-name'+(name.startsWith(':')?' pseudo':'')),el('div',displayValue(value),'header-value'));list.append(row)});if(!list.childElementCount)list.append(el('div','No headers recorded','muted'));box.append(list);return box};
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{
    const requestHeaders=data.request_headers||{},responseHeaders=data.response_headers||data.headers||{},status=data.status==null?responseHeaders[':status']:data.status;
    let host='Captured request';try{host=new URL(data.url).host}catch{}
    const responseUrl=data.response_url||data.final_url||data.url;if(data.final_url&&data.final_url!==data.url){const final=el('div',null,'final');final.append(el('span','↪','muted'),el('strong','Final URL'),safeLink(data.final_url,data.final_url));content.append(final)}
    const exchange=el('div',null,'exchange'),flow=el('div',null,'flow');flow.append(el('span','⇄'),el('span','HTTP exchange'));exchange.append(message('request','Request',data.url,requestHeaders),flow,message('response','Response'+(data.statusText?' · '+data.statusText:''),responseUrl,responseHeaders,status));content.append(exchange);
  }).catch(()=>content.append(el('div','Unable to read header data.','panel muted')));
})();
</script></body></html>
