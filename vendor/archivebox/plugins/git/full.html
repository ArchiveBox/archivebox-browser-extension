<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archived repository</title>
<style>
:root{color-scheme:light;--line:#d1d9e0;--muted:#59636e;--blue:#0969da}*{box-sizing:border-box}body{margin:0;color:#1f2328;background:white;font:14px/1.5 system-ui,-apple-system,sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{background:#f6f8fa;border-bottom:1px solid var(--line);padding:20px 28px}.heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;font-weight:600;margin:0;overflow-wrap:anywhere}.badge{border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted);font-size:12px}.actions{margin-left:auto;display:flex;gap:8px}.button,button{border:1px solid var(--line);border-radius:6px;padding:5px 12px;color:#1f2328;background:#f6f8fa;font:inherit;cursor:pointer}main{max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px}.tree,.readme{border:1px solid var(--line);border-radius:6px;overflow:hidden}.readme-head{background:#f6f8fa;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}.readme{margin-top:18px}iframe{display:block;width:100%;height:650px;border:0;background:white}h2{margin:0 0 12px;font-size:16px}#description{overflow-wrap:anywhere}#topics{display:flex;flex-wrap:wrap;gap:6px}.topic{background:#ddf4ff;color:#0969da;border-radius:20px;padding:2px 10px;font-size:12px}#stars{margin-top:16px;color:var(--muted)}.note{color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:700px){main{display:flex;flex-direction:column;padding:16px;gap:20px}aside{order:-1}header{padding:16px}.actions{margin-left:0}iframe{height:520px}}
</style></head><body>
<header><div class="heading"><h1 id="name">Git repository</h1><span class="badge">Archived</span><div class="actions"><a id="source" class="button" target="_blank" rel="noopener noreferrer" hidden>Original ↗</a><a id="files" class="button">Browse files</a></div></div></header>
<main><section><div class="tree"><div id="entries"></div></div><section class="readme" id="readme" hidden><div class="readme-head"><a id="readme-link">README</a></div></section></section><aside><h2>About</h2><p id="description">Archived Git repository</p><div id="topics"></div><div id="stars" hidden></div><p class="note">Files and metadata from this snapshot. Counts reflect the captured page.</p></aside></main>
</body></html>
