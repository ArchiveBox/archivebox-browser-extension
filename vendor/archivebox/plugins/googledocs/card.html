<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        padding: 12px;
        background: #f5f6f8;
        color: #334155;
        font: 12px/1.5 system-ui, sans-serif;
      }
      .paper {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border: 1px solid #e2e6eb;
        border-radius: 7px;
        background: white;
      }
      .icon {
        font-size: 32px;
        color: #2563eb;
      }
      h1 {
        font-size: 13px;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .formats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 10px;
      }
      .badge {
        border: 1px solid #dbe2ea;
        border-radius: 4px;
        background: white;
        padding: 2px 6px;
        font-size: 10px;
        color: #475569;
      }
    </style>
  </head>
  <body data-output="{{ output_path }}">
    <div class="paper">
      <span class="icon" aria-hidden="true">▤</span>
      <h1 id="title">Google Docs exports</h1>
    </div>
    <div class="formats" id="formats"></div>
    <script>
      const output = new URL(document.body.dataset.output, document.baseURI);
      output.search = "";
      output.hash = "";
      output.searchParams.set("raw", "1");
      fetch(output)
        .then((response) => {
          if (!response.ok) throw Error("Unavailable");
          return response.json();
        })
        .then((manifest) => {
          document.getElementById("title").textContent =
            manifest.title || "Google Docs exports";
          for (const format of new Set(
            (manifest.exports || []).map((item) => item.format)
          )) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = format.toUpperCase();
            document.getElementById("formats").append(badge);
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
