<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hashes</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}nav{display:flex;gap:6px;margin-left:auto}nav a{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:inherit;text-decoration:none}main{width:100%;padding:12px 16px}.metadata{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:12px;margin-bottom:10px}.tree,.tree ul{list-style:none;margin:0;padding:0}.row{display:grid;grid-template-columns:minmax(0,1fr) 76px 190px;gap:14px;align-items:center;min-height:36px;border-bottom:1px solid #eef1f4}.tree summary{cursor:pointer;list-style:none}.tree summary::-webkit-details-marker{display:none}.name{display:flex;align-items:center;gap:7px;min-width:0;padding-left:calc(var(--depth,0)*18px)}.filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{font-size:11px;color:var(--muted);white-space:nowrap}.size{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.hash{display:flex;align-items:center;gap:5px;min-width:0}.hash code{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hash button{flex:none;border:0;background:transparent;color:inherit;padding:5px;cursor:pointer}.chevron{width:10px;font-size:11px;color:var(--muted);flex:none}.chevron::before{content:'▸'}details[open]>summary .chevron::before{content:'▾'}@media(max-width:620px){header{padding:8px;gap:8px}nav .label{display:none}nav a{min-width:40px;min-height:40px}main{padding:8px}.row{grid-template-columns:minmax(0,1fr) 70px;gap:0 10px;padding:5px 0}.hash{grid-column:1/-1;justify-self:end;width:190px}.name{padding-left:calc(var(--depth,0)*12px)}.count{display:none}}
</style></head><body>
<header><h1>{{ plugin_icon }} Hashes</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main id="content"></main>
<script>
(() => {
  const output = new URL('{{ output_path|escapejs }}', location.href); output.search=''; output.hash='';
  const folder = new URL('./', output);
  document.getElementById('files').href=folder.href+'?files=1'; document.getElementById('download').href=output.href; document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};const content=document.getElementById('content');
  const formatSize=value=>{let n=Number(value)||0;const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1000&&i<units.length-1){n/=1000;i++}return `${n<10&&i? n.toFixed(1):Math.round(n)} ${units[i]}`};
  const shortHash=value=>{const s=String(value||'');return s.length>20?`${s.slice(0,12)}…${s.slice(-6)}`:s};
  async function copyText(value,button){try{await navigator.clipboard.writeText(value)}catch{const area=el('textarea',value);area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();document.execCommand('copy');area.remove()}const old=button.textContent;button.textContent='✓';setTimeout(()=>button.textContent=old,900)}
  function hashControl(value,title=''){const wrap=el('span',null,'hash');if(title)wrap.title=title;const code=el('code',shortHash(value));code.title=String(value||'');const button=el('button','⧉','copy');button.type='button';button.title=title?`Copy full SHA-256 (${title})`:'Copy full SHA-256';button.addEventListener('click',()=>copyText(String(value||''),button));wrap.append(code,button);return wrap}
  function treeFromFiles(files){const root={dirs:new Map(),files:[],order:[]};for(const file of files){const parts=String(file.path||'').split('/').filter(Boolean);let node=root;for(const part of parts.slice(0,-1)){if(!node.dirs.has(part))node.dirs.set(part,{dirs:new Map(),files:[],order:[]});node=node.dirs.get(part)}const item={...file,name:parts.at(-1)||file.path||'(unnamed)'};let cursor=root;cursor.order.push(item);for(const part of parts.slice(0,-1)){cursor=cursor.dirs.get(part);cursor.order.push(item)}node.files.push(item)}return root}
  function folderFiles(node){return node.order}
  function folderStats(node){const files=folderFiles(node);return {count:files.length,size:files.reduce((total,file)=>total+(Number(file.size)||0),0),hashes:files.map(file=>file.hash)}}
  async function merkleRoot(hashes){if(!hashes.length)return '';let level=[...hashes];while(level.length>1){const next=[];for(let i=0;i<level.length;i+=2){const left=level[i],right=level[i+1]||left;const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(left+right));next.push([...new Uint8Array(bytes)].map(byte=>byte.toString(16).padStart(2,'0')).join(''))}level=next}return level[0]}
  function row(name,size,hash,depth,count=null){const heading=el(count===null?'div':'summary',null,'row'),label=el('span',null,'name');label.style.setProperty('--depth',depth);if(count!==null)label.append(el('span',null,'chevron'));label.append(el('span',count===null?'📄':'📁'),el('span',name,'filename'));if(count!==null)label.append(el('span',`${count} files`,'count'));heading.append(label,el('span',formatSize(size),'size'),hashControl(hash,count===null?'':'Folder Merkle root'));return heading}
  async function renderBranch(node,depth=1){const list=el('ul');for(const [name,child] of [...node.dirs].sort(([a],[b])=>a.localeCompare(b))){const li=el('li'),details=el('details');const stats=folderStats(child);details.append(row(name,stats.size,await merkleRoot(stats.hashes),depth,stats.count),await renderBranch(child,depth+1));li.append(details);list.append(li)}for(const file of [...node.files].sort((a,b)=>a.name.localeCompare(b.name))){const li=el('li');li.title=file.path;li.append(row(file.name,file.size,file.hash,depth));list.append(li)}return list}
  fetch(output).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(async data=>{
    const meta=data.metadata||{},files=Array.isArray(data.files)?data.files:[];
    const info=el('div',null,'metadata');info.append(el('span','SHA-256 · Merkle tree'));if(meta.timestamp)info.append(el('span',new Date(meta.timestamp).toLocaleString()));content.append(info);
    const tree=el('ul',null,'tree'),item=el('li'),root=el('details');root.open=true;root.append(row('Snapshot',meta.total_size,data.root_hash,0,meta.file_count??files.length),await renderBranch(treeFromFiles(files)));item.append(root);tree.append(item);content.append(tree);
  });
})();
</script></body></html>
