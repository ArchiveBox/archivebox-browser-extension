<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captured responses</title>
<style>
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb}*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:white;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}#count{color:var(--muted);font-size:12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 9px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}main{padding:16px}.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.tile{min-width:0;margin:0;background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.tile>a{position:relative;overflow:hidden;color:inherit;text-decoration:none;display:block;aspect-ratio:1;background:#eceff3}.text-preview{position:absolute;inset:0;margin:0;padding:10px;width:100%;height:100%;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;background:white;font:11px/1.45 ui-monospace,monospace;color:var(--ink)}.tile[data-code="js"]{border-color:#dfbe68}.tile[data-code="js"] .text-preview,.tile[data-code="js"]>a{background:#fff9e8}.tile[data-code="css"]{border-color:#83b9df}.tile[data-code="css"] .text-preview,.tile[data-code="css"]>a{background:#eef7ff}.tile[data-code] .source>span:first-child{font-weight:700;padding:0 5px;border-radius:3px}.tile[data-code="js"] .source>span:first-child{background:#f7e3a4;color:#694b00}.tile[data-code="css"] .source>span:first-child{background:#cfe8fc;color:#14527d}.tile[data-code="json"]{border-color:#82bea9}.tile[data-code="json"] .text-preview,.tile[data-code="json"]>a{background:#edf9f3}.tile[data-code="json"] .source>span:first-child{background:#cceedd;color:#195c43}.tile[data-code="xhr"]{border-color:#b49ad9}.tile[data-code="xhr"] .text-preview,.tile[data-code="xhr"]>a{background:#f5effc}.tile[data-code="xhr"] .source>span:first-child{background:#e4d6f6;color:#60388a}.tile[data-xhr="true"]{box-shadow:inset 0 -3px #b49ad9}.file-icon{display:flex;height:100%;align-items:center;justify-content:center;font-size:44px}.tile img{display:block;width:100%;height:100%;object-fit:contain}.tile figcaption{padding:7px 9px;font-size:11px;color:var(--muted)}.filename{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}.source{display:flex;justify-content:space-between;gap:6px;margin-top:3px}.file-actions{display:flex;align-items:center;gap:7px;margin-left:auto}.file-download{color:var(--ink);text-decoration:none;font-size:16px;line-height:20px;padding:0 3px}.empty{color:var(--muted);padding:24px;text-align:center}@media(max-width:1100px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}nav .label{display:none}header{padding:8px}nav a{min-width:40px;min-height:40px}main{padding:10px}.gallery{gap:8px}}@media(max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:15px}header{gap:6px}#count{font-size:11px}nav{gap:3px}}
header{flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:2}h1{white-space:nowrap}:is(#filters,#domains){display:flex;gap:4px;flex-wrap:wrap}:is(#filters,#domains) button{min-height:28px;padding:3px 7px;font-size:12px}:is(#filters,#domains) button[hidden]{display:none}:is(#filters,#domains) button[aria-pressed=true]{background:#9e1950;color:white;border-color:#9e1950}#search{flex:1 1 150px;min-width:100px;max-width:260px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}.dimensions{font-size:10px;color:var(--muted)}.duplicates{margin-left:6px;font-size:10px;color:var(--muted)}.tile[hidden]{display:none}.source{flex-wrap:wrap}.file-actions{white-space:nowrap}@media(max-width:700px){header{gap:5px}:is(#filters,#domains){order:3;flex:1 1 100%}#search{max-width:none}h1{font-size:14px}nav a{min-height:28px;min-width:28px;padding:3px}nav{margin-left:auto}}
.source-url{display:flex;width:100%;min-height:0;padding:0;border:0;border-radius:0;background:none;text-align:left;justify-content:flex-start;gap:0;font:inherit;color:var(--muted)}.source-url .url-domain{color:#202124;font-weight:600}.url-start{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}.url-end{flex:0 0 auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-url:hover{color:#202124}.source-url:focus-visible{outline:2px solid #9e1950;outline-offset:2px}
</style></head><body>
<header><h1>Captured responses</h1><span id="count" aria-live="polite"></span><input id="search" type="search" placeholder="Search files…" aria-label="Search filename, source URL or MIME type"><div id="filters" role="group" aria-label="File types"></div><div id="domains" role="group" aria-label="Domains"></div><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<main><div id="gallery" class="gallery"></div></main>
<script>
(()=>{
 const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';
 const root=new URL(output);const boundary=root.pathname.lastIndexOf('/responses/');root.pathname=boundary>=0?root.pathname.slice(0,boundary+1):new URL('../',output).pathname;
 const files=[{% for capture in snapshot.archiveresult_set.all %}{% if capture.plugin == 'responses' %}{% for path, info in capture.output_files.items %}{path:'{{ path|escapejs }}',plugin:'{{ capture.plugin|escapejs }}',root:{{ info.root_relative|yesno:'true,false' }},mime:'{{ info.mimetype|escapejs }}',size:'{{ info.size|escapejs }}'},{% endfor %}{% endif %}{% endfor %}];
 let snapshotHost='';try{snapshotHost=new URL('{{ snapshot.url|escapejs }}').hostname}catch{}
 const raw=url=>{const u=new URL(url);u.searchParams.set('raw','1');return u.href};
 document.getElementById('files').href=new URL('responses/?files=1',root).href;document.getElementById('download').href=raw(output);document.getElementById('raw').href=raw(new URL('responses/index.jsonl',root));
 const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
 const classify=file=>{const mime=file.mime.toLowerCase().split(';')[0],ext=file.path.split('.').pop().toLowerCase();if(mime.startsWith('video/'))return [0,'Video','🎞'];if(mime.startsWith('audio/'))return [1,'Audio','🎵'];if(mime==='application/pdf'||ext==='pdf')return [2,'PDF','📕'];if(mime==='application/epub+zip'||ext==='epub')return [2,'EPUB','📚'];if(/officedocument|opendocument|msword|ms-excel|ms-powerpoint/.test(mime)||['doc','docx','ppt','pptx','xls','xlsx','odt','ods','odp','rtf'].includes(ext))return [2,ext.toUpperCase(),'📄'];if(mime==='text/markdown'||mime==='text/x-markdown'||['md','markdown'].includes(ext))return [2,'Markdown','📄'];if(mime.startsWith('image/'))return [3,'Image','🖼'];if(mime==='text/html'||mime==='application/xhtml+xml'||['html','htm'].includes(ext))return [4,'HTML','🌐'];if(mime.startsWith('font/')||/font|woff/.test(mime)||['woff','woff2','ttf','otf','eot','ttc'].includes(ext))return [6,'Font','🔤'];if((mime.startsWith('application/')&&!/json|xml|javascript|ecmascript|sql|yaml|toml|graphql/.test(mime))||mime.startsWith('font/')||/zip|compressed|archive|font|wasm|executable/.test(mime)||['pdf','zip','gz','tar','7z','rar','woff','woff2','ttf','otf','wasm','bin','exe'].includes(ext))return [5,'Binary','📦'];return [7,['css','js','txt','json','xml','csv'].includes(ext)?ext.toUpperCase():'Text / other','📄']};
 const gallery=document.getElementById('gallery'),search=document.getElementById('search'),count=document.getElementById('count');
 const groups=['All','Video','Audio','Documents','Images','HTML','Binary','Fonts','Code','XHR / Fetch'];
 const groupFor=rank=>groups[rank+1];
 const stateKey='responses-gallery:'+root.href;
 let saved={};try{saved=JSON.parse(sessionStorage.getItem(stateKey)||'{}')}catch{}
 let selected=groups.includes(saved.group)?saved.group:'All',entries=[],metadata=new Map(),selectedDomain=saved.domain||'',domainChips=[];
 search.value=saved.search||'';
 const persist=()=>{try{sessionStorage.setItem(stateKey,JSON.stringify({group:selected,search:search.value,domain:selectedDomain,scroll:window.scrollY}))}catch{}};
 addEventListener('scroll',persist,{passive:true});addEventListener('pagehide',persist);
 const chips=groups.map(group=>{const button=el('button',group);button.type='button';button.addEventListener('click',()=>{selected=group;filter();persist()});document.getElementById('filters').append(button);return {group,button}});
 const normalize=path=>path.replace(/^\.\//,'').replace(/^responses\//,'');
 const readable=(file,source)=>{if(source){try{const u=new URL(source);return decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname)}catch{}}
  return file.path.split('/').pop().replace(/^\d{8}T\d{6}__[A-Z]+__/,'').replace(/_([0-9a-f]{2})/gi,(_,hex)=>String.fromCharCode(parseInt(hex,16)));};
 const sizeLabel=size=>size>=1048576?(size/1048576).toFixed(1)+' MB':size>=1024?Math.ceil(size/1024)+' KB':size+' B';
 function filter(){
  const query=search.value.trim().toLowerCase();let visible=0;const totals=Object.fromEntries(groups.map(g=>[g,0])),domainTotals=new Map();
  for(const entry of entries){const matches=entry.search.includes(query),typeMatches=selected==='All'||(selected==='XHR / Fetch'?entry.xhr:entry.group===selected),domainMatches=!selectedDomain||entry.domains.has(selectedDomain);
   if(matches&&domainMatches){totals.All++;totals[entry.group]++;if(entry.xhr)totals['XHR / Fetch']++}
   if(matches&&typeMatches)for(const domain of entry.domains)domainTotals.set(domain,(domainTotals.get(domain)||0)+1);
   entry.tile.hidden=!(matches&&typeMatches&&domainMatches);if(!entry.tile.hidden)visible++;
  }
  for(const {group,button} of chips){button.hidden=group!=='All'&&totals[group]===0;button.textContent=group+' '+totals[group];button.setAttribute('aria-pressed',String(selected===group))}
  for(const {domain,button} of domainChips){const total=domain?domainTotals.get(domain)||0:entries.filter(e=>e.search.includes(query)&&(selected==='All'||(selected==='XHR / Fetch'?e.xhr:e.group===selected))).length;button.hidden=!!domain&&!total&&domain!==selectedDomain;button.textContent=(domain||'All domains')+' '+total;button.setAttribute('aria-pressed',String(selectedDomain===domain))}
  count.textContent=visible+' / '+entries.length;document.getElementById('empty').hidden=visible>0;
 }
 const textCache=new Map();
 const previews=new IntersectionObserver(items=>{for(const item of items){if(!item.isIntersecting)continue;const preview=item.target;previews.unobserve(preview);const url=preview.dataset.url;
  if(!textCache.has(url))textCache.set(url,fetch(url).then(r=>{if(!r.ok)throw new Error('Unavailable');return r.text()}).then(text=>{try{return JSON.stringify(JSON.parse(text),null,2)}catch{return text}}));
  textCache.get(url).then(text=>{preview.textContent=text.slice(0,12000)}).catch(()=>{preview.textContent='Preview unavailable — click to open file'});
 }},{rootMargin:'100px'});
 const isText=file=>{const mime=file.mime.toLowerCase().split(';')[0];return mime.startsWith('text/')||/^application\/(?:[\w.-]+\+)?(?:json|xml)$/.test(mime)||/javascript|ecmascript|yaml|toml|graphql|sql/.test(mime)||/\.(?:jsonl?|txt|csv|tsv|css|js|mjs|xml|html?|md|markdown|yaml|yml|toml|log)$/i.test(file.path)};
 const empty=el('p','No matching files','empty');empty.id='empty';empty.hidden=true;gallery.after(empty);
 function render(){
  const scroll=window.scrollY;previews.disconnect();gallery.replaceChildren();entries=[];const seenPaths=new Set(),hashes=new Map();
  const ordered=files.filter(f=>normalize(f.path).startsWith('all/')).sort((a,b)=>classify(a)[0]-classify(b)[0]||(Number(b.size)||0)-(Number(a.size)||0)||a.path.localeCompare(b.path));
  for(const file of ordered){const path=file.path.replace(/^\.\//,'');if(path.startsWith('/')||path.split('/').includes('..'))continue;
   const relative=file.root?path:file.plugin+'/'+path,url=new URL(relative.split('/').map(encodeURIComponent).join('/'),root).href;
   if(seenPaths.has(url))continue;seenPaths.add(url);
   const info=metadata.get(normalize(path))||{},source=info.url||'',name=readable(file,source),hash=info.responseSha256,xhr=!!info.xhr||['xhr','fetch'].includes((info.resourceType||'').toLowerCase());
   let domain='';try{domain=new URL(source).host}catch{}
   if(hash&&hashes.has(hash)){const entry=hashes.get(hash);if(domain)entry.domains.add(domain);entry.xhr ||= xhr;if(entry.xhr)entry.tile.dataset.xhr='true';entry.copies++;entry.duplicates.textContent='×'+entry.copies+' copies';entry.search+=' '+source.toLowerCase()+' '+name.toLowerCase();entry.duplicates.title+='\n'+(source||path);continue}
   const [rank,label,icon]=classify(file),tile=el('figure',null,'tile'),link=el('a');link.href=url;link.title=source||path;if(/javascript|ecmascript/i.test(file.mime)||/\.(?:m?js|cjs)$/i.test(path))tile.dataset.code='js';else if(/css/i.test(file.mime)||/\.css$/i.test(path))tile.dataset.code='css';else if(/json/i.test(file.mime)||/\.json$/i.test(path))tile.dataset.code='json';else if(xhr)tile.dataset.code='xhr';if(xhr)tile.dataset.xhr='true';
   const entry={tile,xhr,domains:new Set(domain?[domain]:[]),group:groupFor(rank),search:[name,source,path,file.mime].join(' ').toLowerCase(),copies:1};
   const dimensions=el('span','','dimensions');
   if(rank===3){const img=el('img');entry.image=img;img.alt=name;img.loading='lazy';img.decoding='async';img.addEventListener('load',()=>{dimensions.textContent=img.naturalWidth+' × '+img.naturalHeight;});img.src=raw(url);link.append(img)}
   else if(file.size!==''&&Number(file.size)>=0&&Number(file.size)<150*1024&&isText(file)){const preview=el('pre','Loading preview…','text-preview');preview.dataset.url=raw(url);link.setAttribute('aria-label','Open '+name);link.append(preview);previews.observe(preview)}
   else{const glyph=el('span',icon,'file-icon');glyph.setAttribute('aria-label',label);link.append(glyph)}
   const caption=el('figcaption'),filename=el(source?'button':'span',source?null:name,source?'filename source-url':'filename'),meta=el('span',null,'source'),actions=el('span',null,'file-actions');filename.title=source||path;
   if(source){filename.type='button';filename.setAttribute('aria-label','Copy URL: '+source);let pathname=source,domain='';try{const original=new URL(source);if(original.hostname!==snapshotHost)domain=original.host;pathname=original.pathname}catch{}
    const split=pathname.lastIndexOf('/'),start=el('span',null,'url-start'),tail=pathname.slice(split+1);if(domain)start.append(el('span',domain,'url-domain'));start.append(document.createTextNode(pathname.slice(0,split+1)));filename.append(start,el('span',tail,'url-end'));
    filename.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(source);filename.title='Copied! '+source;filename.setAttribute('aria-label','Copied URL: '+source);setTimeout(()=>{filename.title=source;filename.setAttribute('aria-label','Copy URL: '+source)},1500)}catch{filename.title='Could not copy URL: '+source}});
   }
   if(source){try{const original=new URL(source);if(['http:','https:'].includes(original.protocol)){const visit=el('a','↗','file-source');visit.href=original.href;visit.target='_blank';visit.rel='noopener noreferrer';visit.title='Open original URL';visit.setAttribute('aria-label','Open original URL: '+source);actions.append(visit)}}catch{}}
   actions.append(el('span',sizeLabel(Number(file.size)||0)));const download=el('a','⤓','file-download');download.href=raw(url);download.download=/\.[a-z0-9]{1,8}$/i.test(name)?name:name+'.'+file.path.split('.').pop();download.title='Download '+name;download.setAttribute('aria-label',download.title);actions.append(download);
   entry.duplicates=el('span','','duplicates');entry.duplicates.title=source||path;
   meta.append(el('span',label),actions);caption.append(filename,meta,dimensions,entry.duplicates);tile.append(link,caption);gallery.append(tile);entries.push(entry);if(hash)hashes.set(hash,entry);
  }
  const domainCounts=new Map();for(const entry of entries)for(const domain of entry.domains)domainCounts.set(domain,(domainCounts.get(domain)||0)+1);
  const domains=[...domainCounts.keys()].sort((a,b)=>domainCounts.get(b)-domainCounts.get(a)||a.localeCompare(b)).slice(0,14);if(selectedDomain&&!domains.includes(selectedDomain))selectedDomain='';
  document.getElementById('domains').replaceChildren();domainChips=['',...domains].map(domain=>{const button=el('button');button.type='button';button.addEventListener('click',()=>{selectedDomain=domain;filter();persist()});document.getElementById('domains').append(button);return {domain,button}});
  filter();window.scrollTo(0,scroll);
 }
 search.addEventListener('input',()=>{filter();persist()});
 render();requestAnimationFrame(()=>window.scrollTo(0,Number(saved.scroll)||0));
 fetch(raw(new URL('chrome/navigation.json',root))).then(response=>response.ok?response.json():null).then(nav=>{if(nav?.finalUrl){snapshotHost=new URL(nav.finalUrl).hostname;render()}}).catch(()=>{});
 fetch(raw(new URL('responses/index.jsonl',root))).then(response=>{if(!response.ok)throw new Error('Response index unavailable');return response.text()}).then(text=>{for(const line of text.split('\n')){try{const item=JSON.parse(line);if(item.path){const key=normalize(item.path);item.xhr=!!metadata.get(key)?.xhr||['xhr','fetch'].includes((item.resourceType||'').toLowerCase());metadata.set(key,item)}}catch{}}render()}).catch(()=>{});
})();
</script></body></html>
