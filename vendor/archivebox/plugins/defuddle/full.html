<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Defuddle</title>
<style>
:root{color-scheme:light;--ink:#292724;--muted:#6f6a63;--line:#e6e1da;--paper:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:6px 16px;border-bottom:1px solid var(--line);background:#faf9f7;min-height:49px}h1{flex:none;font-size:15px;margin:0;white-space:nowrap}nav{display:flex;flex:none;gap:5px;margin-left:auto}nav a{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);padding:5px 8px;text-decoration:none}nav a:hover{background:#f5f2ed}.chooser{display:flex;align-items:center;gap:6px;min-width:0;flex:1}.chooser[hidden]{display:none}.chooser label{color:var(--muted);flex:none}.chooser label span{display:none}.chooser select{min-width:0;max-width:100%;width:260px;padding:6px 24px 6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);font:12px/1.4 ui-monospace,SFMono-Regular,monospace}.format{color:var(--muted);font-size:10px;text-transform:uppercase}main{width:100%;min-width:0;margin:0}article{width:100%;max-width:76ch;margin:0 auto;padding:32px 24px;font:18px/1.68 Georgia,'Times New Roman',serif;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:var(--muted)}@media(max-width:800px){nav .label{display:none}.format{display:none}}@media(max-width:600px){header{gap:6px;padding:4px 8px;min-height:49px}h1{font-size:14px}header:has(.chooser:not([hidden])) .plugin-label{display:none}.chooser label{display:none}.chooser select{width:100%;min-height:36px}nav{gap:3px}nav a{width:40px;height:40px;padding:0}article{max-width:none;padding:20px 16px;font-size:18px;line-height:1.65}}
html,body{height:100%}body{display:flex;flex-direction:column}header{flex:none}.reader{display:block;width:100%;min-height:0;flex:1;border:0;background:#fff}
</style></head><body>
<header><h1>{{ plugin_icon }} Defuddle</h1><nav aria-label="Output actions"><a id="files" title="View all files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download title="Download" aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" title="View raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header>
<iframe id="reader" class="reader" title="Defuddle reader view" name="preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
<script>
(() => {
  const output=new URL('{{ output_path|escapejs }}',location.href);output.search='';output.hash='';const folder=new URL('./',output);
  const rawBytes=url=>{const value=new URL(url);value.searchParams.set('raw','1');return value};
  document.getElementById('files').href=folder.href+'?files=1';document.getElementById('download').href=rawBytes(output).href;document.getElementById('raw').href=output.href+'?preview=1&raw=1';
  const reader=document.getElementById('reader');reader.addEventListener('load',()=>{const doc=reader.contentDocument;if(!doc?.head)return;for(const link of doc.querySelectorAll('a[href]')){try{const url=new URL(link.href);if(['http:','https:'].includes(url.protocol)&&url.origin!==location.origin){link.target='_blank';link.rel='noopener noreferrer'}}catch{}}for(const img of doc.querySelectorAll('img,svg')){const maxWidth=img.style.maxWidth;img.style.maxWidth=maxWidth&&maxWidth!=='none'?'min(100%, '+maxWidth+')':'100%';for(const dimension of ['width','height']){const value=img.getAttribute(dimension);if(value&&!img.style[dimension])img.style[dimension]=/^\d+(?:\.\d+)?$/.test(value)?value+'px':value}
    // Preserve the saved box ratio when max-width shrinks a large image.
    const width=img.style.width,height=img.style.height;
    if(img.tagName==='IMG'&&/^\d+(?:\.\d+)?px$/.test(width)&&/^\d+(?:\.\d+)?px$/.test(height)&&parseFloat(width)>0&&parseFloat(height)>0){img.style.aspectRatio=parseFloat(width)+' / '+parseFloat(height);img.style.height='auto'}
  }const style=doc.createElement('style');style.textContent="*{box-sizing:border-box}html{background:#fff}body{width:100%;max-width:76ch;margin:0 auto;padding:32px 24px;color:#292724;background:#fff;font:18px/1.68 Georgia,'Times New Roman',serif;overflow-wrap:anywhere}body img,body img:not([width]):not([height]){display:inline-block;vertical-align:middle;margin:0 !important;max-width:100%;max-height:none;object-fit:contain}body img:not([height]){height:auto}body img:not([width]){width:auto}video{max-width:100%;height:auto}svg{max-width:100%}svg:not([height]){height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{display:block;max-width:100%;overflow:auto}@media(max-width:600px){body{max-width:none;padding:20px 16px;line-height:1.65}}";doc.head.append(style)});reader.src=output.href;
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=String(text);if(cls)node.className=cls;return node};
})();
</script></body></html>
