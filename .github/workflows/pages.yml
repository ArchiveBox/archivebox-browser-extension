name: Extension website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Capture extension screenshots']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: fast-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: astral-sh/setup-uv@v7
      - name: Restore latest complete screenshots
        run: uv run --no-project python docs/site/restore-screenshots.py extension docs/site/screenshots
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Render current README and existing screenshot gallery
        run: pnpm site:build --baseurl /archivebox-browser-extension/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
