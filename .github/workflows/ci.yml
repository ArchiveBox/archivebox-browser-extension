name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and package (${{ matrix.browser }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            shard: 1/2
          - browser: chrome
            shard: 2/2
          - browser: edge
          - browser: firefox
          - browser: safari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - name: Build production store bundle
        run: pnpm exec wxt zip -b ${{ matrix.browser }} --mv3
      - uses: ./.github/actions/setup-browser
        if: matrix.browser == 'chrome'
      - name: Test real extension and ArchiveBox API flows
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright test --shard=${{ matrix.shard }} --reporter=line
