name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and package (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox, safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - name: Build production store bundle
        run: pnpm exec wxt zip -b ${{ matrix.browser }} --mv3
      - name: Install browser for import and layout regression tests
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright install --with-deps chromium
      - name: Test real extension import and layout flows
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright test tests/safari-import.test.ts tests/options-responsive.test.ts tests/retention.test.ts tests/server_registry.test.ts
      - name: Verify local capture and reject unconfirmed submissions
        if: matrix.browser == 'chrome'
        run: pnpm exec playwright test tests/popup.test.ts --grep 'action popup saves MHTML|HTTP 200 from a normal website'
