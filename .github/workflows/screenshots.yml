name: Capture extension screenshots

on:
  schedule:
    - cron: '49 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      key: ${{ steps.check.outputs.key }}
      backend: ${{ steps.check.outputs.backend }}
    steps:
      - id: check
        uses: ArchiveBox/monorepo/.github/actions/changed-scheduled-inputs@main


  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-browser
      - run: pnpm compile
      - run: pnpm build
      - name: Capture real extension screens and public store listings
        run: pnpm screenshots
      - uses: astral-sh/setup-uv@v7
      - name: Render README and screenshot gallery
        run: pnpm site:build
      - name: Verify published paths, images, and responsive gallery
        run: pnpm site:verify
      - name: Preserve capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-screenshots
          path: |
            docs/site/screenshots/
            tmp/screenshot-capture-failure/
            test-results/site/
          if-no-files-found: warn
          retention-days: 14
      - name: Save validated screenshot gallery
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: docs/site/screenshots
          if-no-files-found: error
          retention-days: 90

  complete:
    name: 'Scheduled inputs: ${{ needs.changes.outputs.key }}'
    needs: [changes, build]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Scheduled work completed successfully.'
