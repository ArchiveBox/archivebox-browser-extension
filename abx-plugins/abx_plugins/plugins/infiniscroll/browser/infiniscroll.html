<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinite Scroll</title><style>
/* Browser shell, typography and panel palette from canonical chrome/full.html. */
:root{color-scheme:light;--ink:#202b36;--muted:#64748b;--line:#e2e6eb;--accent:#446b97;--paper:#fff;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}h2{font-size:15px;margin:0 0 12px}nav{display:flex;gap:6px;margin-left:auto}nav a,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink);padding:6px 9px;text-decoration:none;font:inherit;cursor:pointer}nav a:hover,button:hover{background:#edf2f7}main{max-width:1180px;margin:auto;padding:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}.muted{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px}.metric span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.metric strong{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}.metric small{display:block;color:var(--muted)}.browser{overflow:hidden;padding:0;border-color:#b7c1cc;box-shadow:0 12px 30px #1e293b17}.chrome-top{background:#dfe3e8;border-bottom:1px solid #c5cbd2}.tabs{height:42px;display:flex;align-items:flex-end;padding:0 14px;gap:12px}.lights{display:flex;gap:6px;padding-bottom:14px}.light{width:11px;height:11px;border-radius:50%}.tab{height:34px;min-width:0;max-width:440px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:#fff;border-radius:9px 9px 0 0}.tab-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:flex;align-items:center;gap:9px;padding:8px 14px;background:#fff}.omnibox{min-width:0;flex:1;border-radius:18px;background:#f1f3f4;padding:6px 13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,1fr)}.document-map{padding:20px;background:linear-gradient(135deg,#f8fbff,#fff);min-width:0;display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:6px;align-content:start;align-items:start}.document-map svg{display:block;width:100%;max-height:860px;grid-column:2;grid-row:1}.detail{border-left:1px solid var(--line);padding:20px;min-width:0}.detail img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#f1f5f9}.detail img[hidden]{display:none}.detail>h2{height:24px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame-preview{position:relative;height:260px;border:1px solid var(--line);border-radius:6px;background:#f8fafc;overflow:hidden}.frame-preview img{position:absolute;inset:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;object-fit:contain}.measurement-preview{position:absolute;inset:24px;display:grid;place-content:center;gap:8px;text-align:center;border:2px solid #7c3aed55;border-radius:4px;color:#64748b;font-variant-numeric:tabular-nums;background:#7c3aed08}.measurement-preview[hidden]{display:none}.controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin:36px 0 0;grid-column:1;grid-row:1;position:sticky;top:12px;height:clamp(260px,55vh,460px);width:38px}.controls button{flex-shrink:0;width:32px;height:32px;padding:0}.controls input{writing-mode:vertical-lr;direction:ltr;min-height:0;min-width:0;width:24px;height:100%;flex:1;accent-color:var(--accent);margin:0;cursor:ns-resize}.controls[hidden]{display:none}.frame-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(3,52px);gap:10px;margin:16px 0}.frame-info>div{min-width:0;overflow:auto}.frame-info dd{overflow-wrap:anywhere}.frame-info dt{font-size:11px;color:var(--muted)}.frame-info dd{margin:0;font-variant-numeric:tabular-nums}.legend{grid-column:1 / -1;display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 0 0}.legend span:before{content:'';display:inline-block;width:18px;border-top:2px solid #446b97;vertical-align:middle;margin-right:6px}.legend .initial:before{border-top:2px dashed #c27a22}.legend .viewport:before{border-color:#7c3aed}.frame-list{overflow:auto;max-height:440px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:500;position:sticky;top:0;background:white}td,th{padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}tbody tr{cursor:pointer}tbody tr:hover,tbody tr[aria-selected=true]{background:#edf2ff}tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.empty{padding:20px;color:var(--muted)}button:disabled{opacity:.4;cursor:default}@media(max-width:700px){header{padding:10px;gap:8px}nav .label{display:none}main{padding:12px}.workspace{grid-template-columns:1fr}.detail{border-left:0;border-top:1px solid var(--line)}.metrics{grid-template-columns:repeat(2,1fr)}.document-map{padding:12px}.panel{padding:14px}.browser{padding:0}}
</style></head><body><header><h1>{{ plugin_icon }} Infinite Scroll</h1><nav aria-label="Output actions"><a id="files" aria-label="View all files">📁<span class="label">View all files</span></a><a id="download" download aria-label="Download">⤓<span class="label">Download</span></a><a id="raw" aria-label="View raw">&lt;/&gt;<span class="label">View raw</span></a></nav></header><main id="content"></main></body></html>
